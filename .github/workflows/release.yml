name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install build packaging pytest ruff twine
          python -m pip install .

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          installed="v$(python -c 'import dwhcore; print(dwhcore.__version__)')"
          echo "tag=${GITHUB_REF_NAME} package=${installed}"
          test "${GITHUB_REF_NAME}" = "${installed}"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build distributions
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Only a v* tag push may upload. A manual dispatch is a dry run: it
    # still builds, lints, tests and twine-checks, but never publishes.
    # A PyPI version cannot be re-uploaded, so an accidental dispatch
    # would burn the version permanently.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
